[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kc761-ha"
version = "0.2.0a6"
description = "KC761x Home Assistant custom integration"
requires-python = ">=3.13"

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["custom_components/kc761"]

[tool.coverage.report]
fail_under = 95
